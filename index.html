<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShopZone - Amazon Style Store | Isha Fatma</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="navbar">
    <div class="logo">Shop<span>Zone</span></div>
    <div class="search-box">
      <input id="searchInput" type="text" placeholder="Search products (e.g., Headphones, Watch)..." />
      <button id="searchBtn">Search</button>
    </div>
    <button id="openCartBtn" class="cart-badge">
      Cart: <span id="cartCount">0</span> | ₹<span id="cartTotal">0</span>
    </button>
  </header>

  <nav class="category-bar" id="categoryBar">
    <button class="cat-btn active" data-category="All">All</button>
    <button class="cat-btn" data-category="Audio">Audio</button>
    <button class="cat-btn" data-category="Wearables">Wearables</button>
    <button class="cat-btn" data-category="Accessories">Accessories</button>
  </nav>

  <section class="hero">
    <h1>Great Indian Deals — First Project Showcase</h1>
    <p>Created by Isha Fatma • Built with HTML, CSS & JavaScript</p>
  </section>

  <main class="container">
    <div id="productGrid" class="grid"></div>
  </main>

  <div id="cartOverlay" class="cart-overlay"></div>
  <aside id="cartDrawer" class="cart-drawer">
    <div class="drawer-header">
      <h2>Your Shopping Cart</h2>
      <button id="closeCartBtn" class="close-btn">&times;</button>
    </div>
    <div id="cartItems" class="drawer-body">
      <p class="empty-msg">Your cart is empty.</p>
    </div>
    <div class="drawer-footer">
      <div class="subtotal">Subtotal: ₹<span id="drawerTotal">0</span></div>
      <button id="checkoutBtn" class="checkout-btn">Proceed to Buy</button>
    </div>
  </aside>

  <script src="script.js"></script>
</body>
</html>
